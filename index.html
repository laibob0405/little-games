<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>寧寧和樂樂的遊戲屋</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#1B2B3A;font:18px/1.6 "Huninn","Microsoft JhengHei","PingFang TC",sans-serif;
  background:linear-gradient(#BFE9FF 0%,#E6F7FF 38%,#FFF7DF 70%,#CDEBB0 70.2%,#A9D98A 100%);background-attachment:fixed;overflow-x:hidden}
.cloud{position:fixed;background:#fff;border-radius:999px;opacity:.85;filter:blur(.3px);z-index:0}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:14%;top:-70%}.cloud::after{width:42%;height:130%;right:14%;top:-48%}
.c1{width:150px;height:44px;top:9%;left:6%;animation:drift 38s linear infinite}
.c2{width:110px;height:34px;top:20%;right:9%;animation:drift 52s linear infinite reverse}
.c3{width:90px;height:28px;top:5%;right:32%;animation:drift 44s linear infinite}
@keyframes drift{0%{transform:translateX(-30px)}50%{transform:translateX(40px)}100%{transform:translateX(-30px)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:18px 16px 0;display:flex;flex-direction:column;gap:16px}
h1{margin:4px 0 0;text-align:center;font-weight:400;font-size:clamp(28px,5.2vw,44px);color:#0E3B43;text-shadow:0 3px 0 #fff}
.sub{margin:-6px 0 0;text-align:center;color:#3F5A63;font-size:clamp(15px,2.4vw,19px)}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.zone{position:relative;border-radius:28px;padding:16px;border:3px solid;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 0 rgba(0,0,0,.08)}
.zone.n{background:#FFF4EC;border-color:#B93A1B}.zone.l{background:#F6EEFF;border-color:#7C4BC0}
.who{display:flex;align-items:center;gap:10px}
.who img{width:clamp(96px,17vw,150px);height:auto;animation:bob 2.6s ease-in-out infinite}
.who h2{margin:0;font-weight:400;font-size:clamp(24px,3.6vw,34px);line-height:1.25}
.who p{margin:2px 0 0;font-size:clamp(15px,2.2vw,19px);opacity:.8}
.n h2{color:#B93A1B}.l h2{color:#6A35B0}
a.card{display:flex;align-items:center;gap:12px;text-decoration:none;color:#1B2B3A;background:#fff;border:3px solid #1B2B3A;border-radius:20px;padding:10px 14px;
  box-shadow:0 6px 0 #1B2B3A;transition:transform .12s,box-shadow .12s}
a.card:hover,a.card:focus-visible{transform:translateY(3px);box-shadow:0 3px 0 #1B2B3A;outline:none}
a.card:active{transform:translateY(6px);box-shadow:0 0 0 #1B2B3A}
a.card img{width:clamp(64px,10vw,92px);height:auto;flex:none}
a.card b{display:block;font-weight:400;font-size:clamp(21px,3vw,28px);line-height:1.3}
a.card span{font-size:clamp(14px,2vw,17px);opacity:.75}
.n a.card:hover{background:#FFE9DC}.l a.card:hover{background:#EFE2FF}
.go{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:24px}
.n .go{background:#F2542D}.l .go{background:#D9488F}
.parade{position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-end;flex-wrap:wrap;gap:2px 6px;margin:22px auto 0;padding:0 8px 14px;max-width:1100px}
.parade img{width:clamp(54px,8.4vw,96px);height:auto;animation:bob 2.2s ease-in-out infinite}
.parade img:nth-child(2n){animation-duration:2.7s;animation-delay:-.6s}.parade img:nth-child(3n){animation-duration:3.1s;animation-delay:-1.1s}
.parade img.big{width:clamp(70px,11vw,124px)}
.note{position:relative;z-index:1;text-align:center;color:#2E5A3A;font-size:15px;margin:0;padding:0 12px 18px}
@media (max-width:720px){.zones{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
<main>
  <h1>寧寧和樂樂的遊戲屋</h1>
  <p class="sub">選一個遊戲、選一隻主角，開始玩！</p>
  <div class="zones">
    <section class="zone n">
      <div class="who"><img src="img/h_rabbit3.webp" alt=""><div><h2>寧寧</h2><p>國文第七課・數學第五單元</p></div></div>
      <a class="card" href="g1.html"><img src="img/n_boss.webp" alt=""><div><b>寧寧的冒險</b><span>國文第七課・寵物對戰</span></div><i class="go" aria-hidden="true">▶</i></a>
      <a class="card" href="g2.html"><img src="img/n_rival.webp" alt=""><div><b>寧寧的塔防</b><span>國文第七課・蓋砲塔守花園</span></div><i class="go" aria-hidden="true">▶</i></a>
      <a class="card" href="g5.html"><img src="img/n_pet3_atk.webp" alt=""><div><b>寧寧的角度射擊場</b><span>數學第五單元・角與形狀</span></div><i class="go" aria-hidden="true">▶</i></a>
    </section>
    <section class="zone l">
      <div class="who"><img src="img/l_pet3.webp" alt=""><div><h2>樂樂</h2><p>國文第一課・數學第六單元</p></div></div>
      <a class="card" href="g3.html"><img src="img/l_ciyu.webp" alt=""><div><b>樂樂的冒險</b><span>國文第一課・寵物對戰</span></div><i class="go" aria-hidden="true">▶</i></a>
      <a class="card" href="g4.html"><img src="img/n_kewen.webp" alt=""><div><b>樂樂的塔防</b><span>國文第一課・蓋砲塔守花園</span></div><i class="go" aria-hidden="true">▶</i></a>
      <a class="card" href="g6.html"><img src="img/l_pet1.webp" alt=""><div><b>樂樂的接水果</b><span>數學第六單元・10 以內的加法</span></div><i class="go" aria-hidden="true">▶</i></a>
    </section>
  </div>
</main>
<div class="parade" aria-hidden="true">
  <img src="img/n_duoyin.webp" alt=""><img src="img/l_zhuyin.webp" alt=""><img src="img/n_xingjin.webp" alt=""><img class="big" src="img/n_pet1.webp" alt="">
  <img src="img/l_renzi.webp" alt=""><img src="img/n_chengyu.webp" alt=""><img src="img/l_bushou.webp" alt=""><img class="big" src="img/l_pet1.webp" alt="">
  <img class="big" src="img/h_rabbit1.webp" alt=""><img class="big" src="img/h_panda1.webp" alt=""><img class="big" src="img/h_cat1.webp" alt="">
  <img src="img/n_xiuci.webp" alt=""><img src="img/l_fangxiang.webp" alt=""><img src="img/n_kewen.webp" alt=""><img src="img/l_ciyu.webp" alt="">
</div>
<p class="note">第一次玩要請爸爸媽媽輸入密碼</p>
</body></html>
