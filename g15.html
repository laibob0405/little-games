const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFromPw(pw){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},m,256));}
async function unlock(raw){const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},k,b64(DATA));return new TextDecoder().decode(buf);}
async function show(html){if(document.readyState!=="complete")await new Promise(r=>addEventListener("load",r,{once:true}));document.open();document.write(html);document.close();}
(async()=>{try{const s=localStorage.getItem(KEYNAME);if(s){await show(await unlock(b64(s)));}}catch(e){try{localStorage.removeItem(KEYNAME)}catch(_){}}})();
document.getElementById("f").addEventListener("submit",async ev=>{ev.preventDefault();const msg=document.getElementById("msg");msg.textContent="解鎖中…";
  try{const raw=await keyFromPw(document.getElementById("pw").value);const html=await unlock(raw);
    if(document.getElementById("keep").checked){try{localStorage.setItem(KEYNAME,btoa(String.fromCharCode(...raw)))}catch(_){}}
    show(html);}catch(e){msg.textContent="密碼不對，再試一次";}});
})();
